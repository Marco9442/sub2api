name: Upstream Sync

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

# 不写 permissions。出现这个键后，GITHUB_TOKEN 就失去修改 workflow 文件的隐式权限。
# 仓库默认令牌必须是 read and write，这个作业才能推送上游提交里的 workflow 文件。

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Propose the latest official upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/upstream-sync/plan.py apply
