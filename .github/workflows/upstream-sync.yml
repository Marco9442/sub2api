name: Upstream Sync

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

# 推送身份是仅安装在本仓的 GitHub App。作业令牌只读检出，不能改 workflow 文件。

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    environment: upstream-sync
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.UPSTREAM_SYNC_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: sub2api
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Propose the latest official upstream release
        env:
          # GH_TOKEN 是 App 令牌，用于推送和开 PR。
          # GITHUB_TOKEN 必须显式传入作业令牌，shell 不会自动带上它。
          # 两者不能相同，否则会用安装令牌去读未安装的上游仓库。
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/upstream-sync/plan.py apply
